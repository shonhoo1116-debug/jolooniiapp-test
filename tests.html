  document.addEventListener('click', function (e) {

<style>

  .q { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; font-size:16px; font-weight:700; line-height:1.35; margin-bottom:10px; }

  /* нүүр хуудас */

  /* ---- «Liquid glass» загвар (туршилт): нүүр, ангилал/бүлгийн жагсаалт, шалгалтын дүн. Асуултын дэлгэц хөндөгдөөгүй. Буцаах: .phone.gl класс авч хаях эсвэл tests.html.bak-glass ---- */

function openLB(src) {
  if (LB) return;

  ov.innerHTML = '<button class="lbx" aria-label="Хаах">✕</button><div class="lbc"></div>';
  const c = ov.querySelector('.lbc'); c.innerHTML = src.innerHTML;
  c.querySelectorAll('svg,canvas').forEach(e => { e.style.maxHeight = 'none'; e.style.width = '100%'; e.style.height = 'auto'; });

  let s = 1, tx = 0, ty = 0; const ptr = new Map(); let d0 = 0, s0 = 1, lastTap = 0;
  const apply = () => {
    const W = innerWidth, H = innerHeight, ch = c.offsetHeight;

  });

    } else { tx += e.clientX - p.x; ty += e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; apply(); }
  });

    const p = ptr.get(e.pointerId); ptr.delete(e.pointerId); if (!p) return;

    }

}

  if (m && !chap.questions.length) { location.hash = '#cat' + (chap.cat || 'B'); return; }   // асуулт нь хараахан ороогүй бүлэг
  const mc = /^#cat([A-Z])$/.exec(h), me = /^#exam([A-Z])?$/.exec(h);   // #exam (хуучин холбоос) = B ангилалын шалгалт
  if ((mc && !catQ(mc[1])) || (me && !catQ(me[1] || 'B'))) { location.hash = '#chapters'; return; }   // асуулт ороогүй ангилал

  bootHide();
}
/* ---- Хөдөлгөөн (лавлах бичлэг шиг): (C) хуруунд зөөлөн шилэн дугуй, (A) хавтан өргөжин хуудас болно, (B) шинэ хуудасны хэсгүүд бүдэгээс тод болж дарааллаар гарна ---- */
const REDUCE = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const blobs = new Map();

  const el = e.target.closest(PRESS); if (!el || REDUCE() || e.button) return;

  b.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
  el.appendChild(b); const grow = b.animate([{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }); blobs.set(e.pointerId, { b, grow });
});
const releaseBlob = e => { const o = blobs.get(e.pointerId); if (!o) return; blobs.delete(e.pointerId);

document.addEventListener('click', e => {

    const h = el.getAttribute('href'); e.preventDefault(); if (el.dataset.go) return; el.dataset.go = 1; el.classList.add('tap');
    if (/.html/.test(h)) { try { sessionStorage.setItem('zam-from-' + h.replace(/\W.*/, ''), '1'); } catch (_) {} setTimeout(() => { location.href = h; }, 240); return; }
    _from = REDUCE() ? null : el.getBoundingClientRect();   // шинэ хуудас энэ хавтангаас өргөжин гарна
    setTimeout(() => { delete el.dataset.go; el.classList.remove('tap'); }, 300); location.hash = h;

});
function enterFx() {
  const from = _from; _from = null; if (REDUCE()) return;
  const ph = app.querySelector('.phone'); if (!ph) return; let base = 0;
  if (from) {
    /* clip-path анимац нь кадр бүрд бүх хуудсыг дахин зурдаг (main thread) тул гацдаг байсан. Тэмдгийн төвөөс өргөжих үр дүнг transform+opacity (compositor)-оор үзүүлнэ. */
    const p = ph.getBoundingClientRect();

    const blur = el.classList.contains('ch') || el.classList.contains('ask') || el.classList.contains('score');   // бүдэгээс тод: backdrop-filter-гүй хэсгүүдэд л
